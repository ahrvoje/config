# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

right_format = "$time $cmd_duration"

# Inserts a blank line between shell prompts
# NOTE: must stay above the first [table] header to remain a top-level key,
# otherwise it is parsed as a key of that table and silently ignored
add_newline = false

# [directory]
# disabled = true

# [git_branch]
# disabled = true

[line_break]
disabled = true

# Replace the '❯' symbol in the prompt with '➜'
[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[➜](bold green)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[time]
disabled = false
time_format = "%H:%M:%S"         # strftime; change as you like
style = "dimmed"

[cmd_duration]
min_time = 0                     # 0 = always show (default is 2000 ms)
show_milliseconds = true
style = "dimmed"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind ]($style) )"

# Per-status tokens with counts
conflicted = " =${count}"
ahead      = " ⇡${count}"
behind     = " ⇣${count}"
diverged   = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked  = " ?"
stashed    = " ≡${count}"
modified   = " !${count}"
staged     = " +${count}"
renamed    = " »${count}"
deleted    = " ✘${count}"

# Optional: ignore submodule dirt
# ignore_submodules = true

